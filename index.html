const blockedKeys = [
  "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"
];

window.addEventListener("keydown", (event) => {
  if (blockedKeys.includes(event.code)) event.preventDefault();

  if (!keys[event.code]) justPressed[event.code] = true;
  keys[event.code] = true;

  startAudio();
});

window.addEventListener("keyup", (event) => {
  keys[event.code] = false;
});

canvas.addEventListener("click", () => {
  canvas.focus();
  startAudio();
});

/* ---------------------------
   SOUND
---------------------------- */
let audioContext = null;
let soundOn = true;

function startAudio() {
  if (!audioContext) {
    const AudioAPI = window.AudioContext || window.webkitAudioContext;
    if (AudioAPI) audioContext = new AudioAPI();
  }

  if (audioContext && audioContext.state === "suspended") {
    audioContext.resume();
  }
}

function playSound(type) {
  if (!soundOn) return;

  startAudio();
  if (!audioContext) return;

  const oscillator = audioContext.createOscillator();
  const gain = audioContext.createGain();

  oscillator.connect(gain);
  gain.connect(audioContext.destination);

  const now = audioContext.currentTime;

  const sounds = {
    menu:     ["triangle", 460, 680, 0.04, 0.08],
    jump:     ["square",   220, 500, 0.04, 0.12],
    attack:   ["sawtooth", 170,  65, 0.05, 0.12],
    hit:      ["square",   140,  45, 0.07, 0.14],
    special:  ["triangle", 280, 720, 0.06, 0.20],
    ultimate: ["sawtooth", 120,  35, 0.08, 0.45],
    parry:    ["sine",     650, 1200, 0.07, 0.20],
    ko:       ["sawtooth", 250,  30, 0.08, 0.50]
  };

  const [wave, start, end, volume, duration] = sounds[type] || sounds.menu;

  oscillator.type = wave;
  oscillator.frequency.setValueAtTime(start, now);
  oscillator.frequency.exponentialRampToValueAtTime(
    Math.max(1, end),
    now + duration
  );

  gain.gain.setValueAtTime(volume, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

  oscillator.start(now);
  oscillator.stop(now + duration);
}

/* ---------------------------
   HELPERS
---------------------------- */
function pressed(code) {
  return !!justPressed[code];
}

function clamp(number, min, max) {
  return Math.max(min, Math.min(max, number));
}

function rectHit(a, b) {
  return (
    a.x < b.x + b.w &&
    a.x + a.w > b.x &&
    a.y < b.y + b.h &&
    a.y + a.h > b.y
  );
}

function damageColor(damage) {
  if (damage >= 200) return "#ff2940";
  if (damage >= 150) return "#ff5c36";
  if (damage >= 100) return "#ff9b36";
  if (damage >= 50) return "#ffe75b";
  return "#ffffff";
}

function addParticles(x, y, color, amount, speed = 3, life = 25) {
  for (let i = 0; i < amount; i++) {
    particles.push({
      x,
      y,
      vx: (Math.random() - 0.5) * speed * 2,
      vy: (Math.random() - 0.5) * speed * 2,
      life: life + Math.random() * 10,
      maxLife: life + 10,
      size: 2 + Math.random() * 5,
      color,
      gravity: 0.08
    });
  }
}

function addText(x, y, text, color = "#ffffff") {
  floatingTexts.push({
    x,
    y,
    text,
    color,
    life: 45,
    vy: -1.1
  });
}

function getOpponent(player) {
  return player.number === 1 ? p2 : p1;
}

function isHomeArena(player) {
  return currentStage &&
    player.fighter.homeStage === currentStage.name;
}

function randomPlayer() {
  return Math.random() < 0.5 ? p1 : p2;
}

/* Hazard strength becomes more dangerous
   when a fighter already has high damage. */
function hazardPowerFor(player, basePower) {
  const extra = 1 + player.damage / 100;
  return basePower * extra;
}

/* ---------------------------
   MENU INPUT + BACK BUTTON
---------------------------- */
function moveGridCursor(cursor, direction) {
  const columns = 4;
  const rows = 3;

  let col = cursor % columns;
  let row = Math.floor(cursor / columns);

  if (direction === "left") col = (col + columns - 1) % columns;
  if (direction === "right") col = (col + 1) % columns;
  if (direction === "up") row = (row + rows - 1) % rows;
  if (direction === "down") row = (row + 1) % rows;

  return row * columns + col;
}

function updateMenu() {
  /* Animated loading screen */
  if (screen === "loading") {
    loadingTimer++;

    if (loadingTimer > 185 || pressed("Enter") || pressed("Space")) {
      screen = "title";
      playSound("special");
    }
    return;
  }

  /* Title screen choices */
  if (screen === "title") {
    if (pressed("Digit1")) {
      mode = "cpu";
      difficulty = "hard";
      selectStep = 0;
      screen = "select";
      playSound("menu");
    }

    if (pressed("Digit2")) {
      mode = "vs";
      selectStep = 0;
      screen = "select";
      playSound("menu");
    }

    if (pressed("Digit3")) {
      mode = "practice";
      difficulty = "hard";
      selectStep = 0;
      screen = "select";
      playSound("menu");
    }

    if (pressed("KeyM")) {
      soundOn = !soundOn;
      playSound("menu");
    }

    return;
  }

  /* Character select */
  if (screen === "select") {
    if (selectStep === 0) {
      /* Player 1 moves blue cursor */
      if (pressed("KeyA")) {
        p1Cursor = moveGridCursor(p1Cursor, "left");
        p1Choice = p1Cursor;
        playSound("menu");
      }

      if (pressed("KeyD")) {
        p1Cursor = moveGridCursor(p1Cursor, "right");
        p1Choice = p1Cursor;
        playSound("menu");
      }

      if (pressed("KeyW")) {
        p1Cursor = moveGridCursor(p1Cursor, "up");
        p1Choice = p1Cursor;
        playSound("menu");
      }

      if (pressed("KeyS")) {
        p1Cursor = moveGridCursor(p1Cursor, "down");
        p1Choice = p1Cursor;
        playSound("menu");
      }

      /* CPU/player 2 cursor */
      if (pressed("ArrowLeft")) {
        p2Cursor = moveGridCursor(p2Cursor, "left");
        p2Choice = p2Cursor;
        playSound("menu");
      }

      if (pressed("ArrowRight")) {
        p2Cursor = moveGridCursor(p2Cursor, "right");
        p2Choice = p2Cursor;
        playSound("menu");
      }

      if (pressed("ArrowUp")) {
        p2Cursor = moveGridCursor(p2Cursor, "up");
        p2Choice = p2Cursor;
        playSound("menu");
      }

      if (pressed("ArrowDown")) {
        p2Cursor = moveGridCursor(p2Cursor, "down");
        p2Choice = p2Cursor;
        playSound("menu");
      }

      /* CPU difficulty */
      if (mode === "cpu" || mode === "practice") {
        if (pressed("Digit1")) difficulty = "easy";
        if (pressed("Digit2")) difficulty = "medium";
        if (pressed("Digit3")) difficulty = "hard";

        if (pressed("KeyF") || pressed("Enter")) {
          selectStep = 1;
          playSound("menu");
        }
      }

      /* Two-player confirmation */
      if (mode === "vs") {
        if (pressed("KeyF") && pressed("KeyK")) {
          selectStep = 1;
          playSound("menu");
        }
      }

      if (pressed("Escape")) {
        screen = "title";
        playSound("menu");
      }

      return;
    }

    /* Stage select */
    if (selectStep === 1) {
      if (mode === "practice") {
        /* Practice always uses Training Room */
        if (pressed("KeyF") || pressed("Enter")) {
          startMatch();
          playSound("menu");
        }

        if (pressed("Escape")) {
          selectStep = 0;
          playSound("menu");
        }

        return;
      }

      if (pressed("KeyA") || pressed("ArrowLeft")) {
        stageChoice = (stageChoice + stages.length - 1) % stages.length;
        playSound("menu");
      }

      if (pressed("KeyD") || pressed("ArrowRight")) {
        stageChoice = (stageChoice + 1) % stages.length;
        playSound("menu");
      }

      if (pressed("KeyF") || pressed("Enter")) {
        startMatch();
        playSound("menu");
      }

      if (pressed("Escape")) {
        selectStep = 0;
        playSound("menu");
      }
    }

    return;
  }

  /* Game over screen */
  if (screen === "over") {
    if (pressed("KeyR") || pressed("Enter")) {
      screen = "select";
      selectStep = 0;
      playSound("menu");
    }

    if (pressed("Escape")) {
      screen = "title";
      playSound("menu");
    }
  }
}

/* ---------------------------
   MOVING PLATFORMS
---------------------------- */
function updatePlatforms() {
  for (const platform of currentStage.platforms) {
    if (!platform.moving) continue;

    platform.previousX = platform.x;
    platform.previousY = platform.y;

    if (platform.direction === "x") {
      const start = platform.startX ?? platform.x;

      platform.x =
        start +
        Math.sin(frame * platform.speed) * platform.range;
    }

    if (platform.direction === "y") {
      const start = platform.startY ?? platform.y;

      platform.y =
        start +
        Math.sin(frame * platform.speed) * platform.range;
    }

    platform.moveX = platform.x - platform.previousX;
    platform.moveY = platform.y - platform.previousY;
  }
}

/* ---------------------------
   BETTER CPU
---------------------------- */
function cpuInput(player, opponent) {
  const input = {
    left: false,
    right: false,
    jump: false,
    attack: false,
    special: false,
    shield: false,
    ultimate: false
  };

  if (!roundStarted || player.stunned > 0) return input;

  const skill = difficulty === "easy"
    ? 0.42
    : difficulty === "medium"
      ? 0.72
      : 0.95;

  const distance = opponent.x - player.x;
  const absDistance = Math.abs(distance);
  const opponentAbove = opponent.y + 28 < player.y;
  const opponentAttacking =
    opponent.attackTimer > 0 ||
    opponent.airAttackTimer > 0 ||
    opponent.specialTimer > 0 ||
    opponent.ultimateTimer > 0;

  /* CPU makes a small plan every few frames */
  if (player.cpuThinkTimer <= 0) {
    player.cpuThinkTimer = difficulty === "hard" ? 8 : 15;

    if (absDistance > 220) {
      player.cpuPlan = "approach";
    } else if (absDistance < 65) {
      player.cpuPlan = Math.random() < 0.45 ? "attack" : "retreat";
    } else {
      player.cpuPlan = Math.random() < 0.55 ? "attack" : "approach";
    }
  } else {
    player.cpuThinkTimer--;
  }

  /* Easy CPU sometimes pauses */
  if (Math.random() > skill) return input;

  /* Shield likely attacks */
  if (
    opponentAttacking &&
    absDistance < 95 &&
    Math.random() < 0.05 + skill * 0.22
  ) {
    input.shield = true;
  }

  /* Move toward opponent */
  if (player.cpuPlan === "approach") {
    if (distance < -42) input.left = true;
    if (distance > 42) input.right = true;
  }

  /* Move away if too close sometimes */
  if (player.cpuPlan === "retreat") {
    if (distance < 0) input.right = true;
    if (distance > 0) input.left = true;
  }

  /* Jump toward high opponents or dodge */
  if (
    player.grounded &&
    (
      opponentAbove ||
      (opponentAttacking && absDistance < 85) ||
      Math.random() < 0.008 * skill
    )
  ) {
    input.jump = true;
  }

  /* Basic attack near target */
  if (
    absDistance < 78 &&
    Math.random() < 0.06 + skill * 0.25
  ) {
    input.attack = true;
  }

  /* Use special at medium distance */
  if (
    absDistance > 75 &&
    absDistance < 320 &&
    player.specialCooldown <= 0 &&
    Math.random() < 0.012 + skill * 0.06
  ) {
    input.special = true;
  }

  /* Use special near an opponent too */
  if (
    absDistance < 90 &&
    player.specialCooldown <= 0 &&
    Math.random() < 0.008 + skill * 0.035
  ) {
    input.special = true;
  }

  /* Ultimate */
  if (
    player.meter >= 100 &&
    player.ultimateCooldown <= 0 &&
    absDistance < 220 &&
    Math.random() < 0.01 + skill * 0.08
  ) {
    input.ultimate = true;
  }

  return input;
}

function playerInput(player) {
  if (player.number === 2 && (mode === "cpu" || mode === "practice")) {
    return cpuInput(player, p1);
  }

  const c = player.controls;

  return {
    left: !!keys[c.left],
    right: !!keys[c.right],
    jump: pressed(c.jump),
    attack: !!keys[c.attack],
    special: !!keys[c.special],
    shield: !!keys[c.shield],
    ultimate: !!keys[c.ultimate]
  };
}

function startComboCinematic(attacker, target, title, color) {

function hurt(target, attacker, direction, baseDamage, basePower, color, hitType = "basic") {
  if (target.invincible > 0) return false;

  /* Perfect parry */
  if (target.parryTimer > 0) {
    attacker.stunned = 35;
    attacker.vx = -direction * 5;
    attacker.vy = -5;

    target.meter = clamp(target.meter + 20, 0, 100);

    addParticles(
      target.x + target.w / 2,
      target.y + target.h / 2,
      "#ffffff",
      24,
      5
    );

    addText(
      target.x + target.w / 2,
      target.y - 12,
      "PERFECT PARRY!",
      "#ffffff"
    );

    screenShake = 7;
    flashTimer = 5;
    playSound("parry");

    return false;
  }

  /* Shield */
  if (target.shielding && target.shield > 0) {
    target.shield -= baseDamage * 3.2;
    target.meter = clamp(target.meter + baseDamage * 0.75, 0, 100);
    target.vx = direction * 1.4;

    addParticles(
      target.x + target.w / 2,
      target.y + target.h / 2,
      "#90efff",
      8,
      2
    );

    if (target.shield <= 0) {
      target.shield = 0;
      target.shieldBroken = 105;
      target.stunned = 55;

      addText(
        target.x + target.w / 2,
        target.y - 12,
        "SHIELD BREAK!",
        "#fff16b"
      );

      addParticles(
        target.x + target.w / 2,
        target.y + target.h / 2,
        "#fff16b",
        30,
        6
      );

      screenShake = 10;
    }

    return false;
  }

  playSound("hit");

  /* Combo bonus: only small extra damage */
  let comboBonus = 0;

  if (attacker.comboTimer > 0) {
    attacker.combo++;
  } else {
    attacker.combo = 1;
  }

  attacker.comboTimer = 58;
  attacker.lastHitType = hitType;

  if (attacker.combo === 3) {
    comboBonus = 2;
    startComboCinematic(
      attacker,
      target,
      "3 HIT COMBO!",
      attacker.fighter.element
    );
  }

  if (
    attacker.combo >= 2 &&
    (hitType === "special" || hitType === "air")
  ) {
    comboBonus = Math.max(comboBonus, 3);

    startComboCinematic(
      attacker,
      target,
      hitType === "special" ? "SPECIAL FINISH!" : "AIR FINISH!",
      attacker.fighter.element
    );
  }

  target.damage = clamp(target.damage + baseDamage + comboBonus, 0, 999);
  target.meter = clamp(target.meter + baseDamage * 1.2, 0, 100);
  attacker.meter = clamp(attacker.meter + baseDamage * 1.65, 0, 100);

  const damageMultiplier = 1 + target.damage / 85;
  const knockback = basePower * damageMultiplier;

  target.vx = direction * knockback;
  target.vy = -Math.min(18, 3.8 + knockback * 0.72);
  target.grounded = false;

  target.invincible = 13;
  target.trailTimer = 20;

  addParticles(
    target.x + target.w / 2,
    target.y + target.h / 2,
    color,
    15,
    4 + basePower / 2
  );

  addParticles(
    target.x + target.w / 2,
    target.y + target.h / 2,
    "#ffffff",
    5,
    3
  );

  screenShake = Math.min(15, Math.floor(basePower + 2));

  return true;
}

/* ---------------------------
   PLAYER UPDATE
---------------------------- */
function updatePlayer(player, opponent) {
  const input = playerInput(player);

  if (player.invincible > 0) player.invincible--;
  if (player.cooldown > 0) player.cooldown--;
  if (player.specialCooldown > 0) player.specialCooldown--;
  if (player.ultimateCooldown > 0) player.ultimateCooldown--;
  if (player.parryTimer > 0) player.parryTimer--;
  if (player.shieldBroken > 0) player.shieldBroken--;
  if (player.stunned > 0) player.stunned--;
  if (player.slowTimer > 0) player.slowTimer--;
  if (player.trailTimer > 0) player.trailTimer--;

  if (player.comboTimer > 0) {
    player.comboTimer--;
  } else {
    player.combo = 0;
  }

  if (!player.shielding && player.shieldBroken <= 0) {
    player.shield = clamp(player.shield + 0.3, 0, 100);
  }

  const canAct =
    player.stunned <= 0 &&
    roundStarted &&
    !suddenDeathStarting;

  /* Shield and parry */
  player.shielding = false;

  if (
    canAct &&
    input.shield &&
    player.attackTimer <= 0 &&
    player.airAttackTimer <= 0 &&
    player.specialTimer <= 0 &&
    player.ultimateTimer <= 0 &&
    player.shieldBroken <= 0 &&
    player.shield > 0
  ) {
    player.shielding = true;
    player.vx *= 0.68;

    if (pressed(player.controls.shield)) {
      player.parryTimer = 6;
    }
  }

  /* Horizontal movement */
  if (
    canAct &&
    !player.shielding &&
    player.specialTimer <= 0 &&
    player.ultimateTimer <= 0
  ) {
    let speed = 0.77;

    if (player.fighter.id === "volt" && isHomeArena(player)) speed = 0.96;
    if (player.fighter.id === "orbit" && isHomeArena(player)) speed = 0.88;
    if (player.slowTimer > 0) speed *= 0.56;

    if (input.left) {
      player.vx -= speed;
      player.facing = -1;
    }

    if (input.right) {
      player.vx += speed;
      player.facing = 1;
    }
  }

  /* Jump */
  if (
    canAct &&
    input.jump &&
    !player.shielding &&
    player.ultimateTimer <= 0
  ) {
    const orbitDoubleJump =
      player.fighter.id === "orbit" &&
      isHomeArena(player) &&
      player.airJumps < 1;

    if (player.grounded || orbitDoubleJump) {
      let jumpPower = -12;

      if (player.fighter.id === "zephyr" && isHomeArena(player)) {
        jumpPower = -14;
      }

      if (currentStage.lowGravity) jumpPower -= 1.2;

      if (!player.grounded) player.airJumps++;

      player.vy = jumpPower;
      player.grounded = false;

      addParticles(
        player.x + player.w / 2,
        player.y + player.h,
        player.fighter.element,
        7,
        2
      );

      playSound("jump");
    }
  }

  /* Air attack */
  if (
    canAct &&
    input.attack &&
    !player.grounded &&
    player.vy > 1 &&
    player.cooldown <= 0 &&
    player.specialTimer <= 0 &&
    player.ultimateTimer <= 0 &&
    player.airAttackTimer <= 0 &&
    !player.shielding
  ) {
    player.airAttackTimer = 15;
    player.cooldown = 30;
    player.hitThisMove = false;
    player.vy = 5.2;

    playSound("attack");
  }

  /* Basic attack */
  if (
    canAct &&
    input.attack &&
    player.grounded &&
    player.cooldown <= 0 &&
    player.specialTimer <= 0 &&
    player.ultimateTimer <= 0 &&
    !player.shielding
  ) {
    player.attackTimer = 11;
    player.cooldown = 22;
    player.hitThisMove = false;

    playSound("attack");
  }

  /* Special */
  if (
    canAct &&
    input.special &&
    player.specialCooldown <= 0 &&
    player.attackTimer <= 0 &&
    player.airAttackTimer <= 0 &&
    player.ultimateTimer <= 0 &&
    !player.shielding
  ) {
    useSpecial(player);
  }

  /* Ultimate */
  if (
    canAct &&
    input.ultimate &&
    player.meter >= 100 &&
    player.ultimateCooldown <= 0 &&
    player.attackTimer <= 0 &&
    player.airAttackTimer <= 0 &&
    player.specialTimer <= 0
  ) {
    startUltimate(player);
  }

  updateAttackHitboxes(player, opponent);
  updateSpecialHitboxes(player, opponent);
  updateUltimateHitbox(player, opponent);

  /* Gravity */
  let gravity = currentStage.lowGravity ? 0.38 : 0.62;

  if (player.fighter.id === "orbit" && player.ultimateTimer > 0) {
    gravity = 0.27;
  }

  player.vy += gravity;
  player.vy = Math.min(player.vy, 16);

  const oldY = player.y;

  player.x += player.vx;
  player.y += player.vy;

  /* Friction */
  if (player.specialTimer <= 0 && player.ultimateTimer <= 0) {
    let friction = player.grounded ? 0.77 : 0.94;

    if (player.onSlippery) friction = 0.91;

    player.vx *= friction;
  }

  /* Land on platforms */
  player.grounded = false;
  player.onSlippery = false;

  for (const platform of currentStage.platforms) {
    const wasAbove = oldY + player.h <= platform.y + 9;

    const overlaps =
      player.x + player.w > platform.x &&
      player.x < platform.x + platform.w;

    if (
      player.vy >= 0 &&
      wasAbove &&
      player.y + player.h >= platform.y &&
      overlaps
    ) {
      player.y = platform.y - player.h;
      player.vy = 0;
      player.grounded = true;
      player.airJumps = 0;
      player.onSlippery = !!platform.slippery;

      if (platform.moving) {
        player.x += platform.moveX || 0;
        player.y += platform.moveY || 0;
      }
    }
  }

  /* In practice mode, players do not lose lives */
  if (
    player.y > HEIGHT + 110 ||
    player.x < -175 ||
    player.x > WIDTH + 175
  ) {
    if (mode === "practice") {
      resetPlayer(player);
      addText(WIDTH / 2, 150, "TRAINING RESET", "#d8d8d8");
    } else {
      loseLife(player);
    }
  }
}

/* ---------------------------
   PROJECTILE UPDATES
---------------------------- */
function updateProjectiles() {
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const shot = projectiles[i];
    const target = getOpponent(shot.owner);

    shot.x += shot.vx;
    shot.y += shot.vy;
    shot.vy += shot.gravity || 0;
    shot.life--;

    /* Gravity and void shots pull nearby enemies */
    if (shot.pull > 0) {
      const dx = shot.x + shot.w / 2 - (target.x + target.w / 2);
      const dy = shot.y + shot.h / 2 - (target.y + target.h / 2);
      const distance = Math.hypot(dx, dy);

      if (distance < 155 && distance > 5) {
        target.vx += (dx / distance) * shot.pull;
        target.vy += (dy / distance) * shot.pull;
      }
    }

    if (rectHit(shot, target)) {
      const hit = hurt(
        target,
        shot.owner,
        shot.vx >= 0 ? 1 : -1,
        shot.damage,
        shot.power,
        shot.color,
        "special"
      );

      if (hit && shot.kind === "ice") {
        target.slowTimer = isHomeArena(shot.owner) ? 110 : 65;
      }

      projectiles.splice(i, 1);
      continue;
    }

    if (
      shot.life <= 0 ||
      shot.x < -100 ||
      shot.x > WIDTH + 100 ||
      shot.y > HEIGHT + 100
    ) {
      projectiles.splice(i, 1);
    }
  }
}

/* ---------------------------
   LIFE / KO
---------------------------- */
function loseLife(player) {
  /* Practice mode cannot lose */
  if (mode === "practice") {
    resetPlayer(player);
    return;
  }

  player.lives--;
  screenShake = 14;
  flashTimer = 8;
  koTimer = 34;

  addParticles(
    player.x + player.w / 2,
    player.y + player.h / 2,
    player.fighter.element,
    36,
    7,
    35
  );

  playSound("ko");

  if (player.lives <= 0) {
    gameOver = true;
    screen = "over";

    const winner = player.number === 1 ? p2 : p1;
    winnerText = `${winner.fighter.name} WINS!`;
  } else {
    resetPlayer(player);
  }
}

/* ---------------------------
   HAZARD CREATION
   All falling hazards ignore platforms.
   They only hit a fighter or leave the screen.
---------------------------- */

function addHazard(type, data = {}) {
  activeHazards.push({
    type,
    x: data.x ?? 0,
    y: data.y ?? 0,
    w: data.w ?? 30,
    h: data.h ?? 30,
    vx: data.vx ?? 0,
    vy: data.vy ?? 0,
    life: data.life ?? 120,
    warning: data.warning ?? 35,
    active: false,
    target: data.target ?? randomPlayer(),
    color: data.color ?? "#ffffff",
    power: data.power ?? 6,
    damage: data.damage ?? 8,
    direction: data.direction ?? 1,
    extra: data.extra ?? 0
  });
}

function targetPosition(player, width = 30) {
  return clamp(
    player.x + player.w / 2 - width / 2 + (Math.random() - 0.5) * 35,
    15,
    WIDTH - width - 15
  );
}

function chooseHazard() {
  if (
    currentStage.practice ||
    !roundStarted ||
    suddenDeathStarting ||
    gameOver
  ) {
    return;
  }

  /* Normal mode is calmer: one strong hazard at a time. */
  const hazardList = suddenDeath
    ? [...currentStage.hazards, ...currentStage.suddenHazards]
    : currentStage.hazards;

  if (!hazardList || hazardList.length === 0) return;

  const strongHazards = activeHazards.filter(h => h.warning > 0 || h.active);

  if (!suddenDeath && strongHazards.length >= 1) return;
  if (suddenDeath && strongHazards.length >= 3) return;

  const type = hazardList[Math.floor(Math.random() * hazardList.length)];
  spawnArenaHazard(type);
}

/* ---------------------------
   HAZARD UPDATES
---------------------------- */
function damageHazardPlayer(player, hazard, direction = 1) {
  if (player.invincible > 0) return;

  hurt(
    player,
    getOpponent(player),
    direction,
    hazard.damage,
    hazardPowerFor(player, hazard.power),
    hazard.color,
    "hazard"
  );
}

function updateHazards() {
  if (currentStage.practice || !roundStarted || suddenDeathStarting) return;

  /* Choose new hazards at changing intervals */
  const interval = suddenDeath ? 70 : 155;

  if (frame % interval === 0) {
    chooseHazard();
  }

  for (let i = activeHazards.length - 1; i >= 0; i--) {
    const hazard = activeHazards[i];

    hazard.life--;
    if (hazard.warning > 0) {
      hazard.warning--;
    } else {
      hazard.active = true;
    }

    /* Falling objects target a position, then fall through all platforms */
    if (hazard.type === "fallingObject") {
      if (hazard.warning <= 0) {
        hazard.vy += 0.42;
        hazard.y += hazard.vy;
      }
    }

    if (
      hazard.type === "swoop" ||
      hazard.type === "lightningBall" ||
      hazard.type === "banana" ||
      hazard.type === "mineCart" ||
      hazard.type === "chainSweep" ||
      hazard.type === "shark"
    ) {
      if (hazard.warning <= 0) {
        hazard.x += hazard.vx;
      }
    }

    if (hazard.type === "rollingBoulder") {
      if (hazard.warning <= 0) {
        hazard.x += hazard.vx;
        hazard.vy += 0.25;
        hazard.y += hazard.vy;

        /* It can roll and drop through lower areas */
        for (const platform of currentStage.platforms) {
          const overlapping =
            hazard.x + hazard.w > platform.x &&
            hazard.x < platform.x + platform.w;

          const wasAbove = hazard.y + hazard.h - hazard.vy <= platform.y + 4;

          if (
            hazard.vy >= 0 &&
            wasAbove &&
            hazard.y + hazard.h >= platform.y &&
            overlapping
          ) {
            hazard.y = platform.y - hazard.h;
            hazard.vy = 0;
          }
        }
      }
    }

    if (hazard.type === "whirlpool") {
      if (hazard.warning <= 0) {
        for (const player of [p1, p2]) {
          const centerX = hazard.x + hazard.w / 2;
          const centerY = hazard.y + hazard.h / 2;
          const dx = centerX - (player.x + player.w / 2);
          const dy = centerY - (player.y + player.h / 2);
          const distance = Math.hypot(dx, dy);

          if (distance < 135 && distance > 5) {
            player.vx += (dx / distance) * 0.25;
            player.vy += (dy / distance) * 0.13;
          }

          if (rectHit(player, hazard)) {
            damageHazardPlayer(player, hazard, dx > 0 ? 1 : -1);
          }
        }
      }
    }

    if (hazard.type === "gravityZone") {
      if (hazard.warning <= 0) {
        for (const player of [p1, p2]) {
          const centerX = hazard.x + hazard.w / 2;
          const centerY = hazard.y + hazard.h / 2;
          const dx = centerX - (player.x + player.w / 2);
          const dy = centerY - (player.y + player.h / 2);
          const distance = Math.hypot(dx, dy);

          if (distance < 180 && distance > 5) {
            player.vx += (dx / distance) * 0.28;
            player.vy += (dy / distance) * 0.17;
          }

          if (rectHit(player, hazard)) {
            damageHazardPlayer(player, hazard, dx > 0 ? 1 : -1);
          }
        }
      }
    }

    if (hazard.type === "windZone" || hazard.type === "domeJet") {
      if (hazard.warning <= 0) {
        for (const player of [p1, p2]) {
          if (rectHit(player, hazard)) {
            /* Wind becomes much scarier at high damage */
            const windStrength =
              0.16 +
              player.damage / 150 * 0.45;

            player.vx += hazard.direction * windStrength;

            if (frame % 18 === 0) {
              damageHazardPlayer(player, {
                ...hazard,
                damage: 3,
                power: hazard.power * 0.45
              }, hazard.direction);
            }
          }
        }
      }
    }

    if (hazard.type === "snowstorm") {
      if (hazard.warning <= 0) {
        for (const player of [p1, p2]) {
          player.slowTimer = Math.max(player.slowTimer, 25);
        }
      }
    }

    if (hazard.type === "mist") {
      if (hazard.warning <= 0) {
        for (const player of [p1, p2]) {
          if (rectHit(player, hazard)) {
            player.slowTimer = Math.max(player.slowTimer, 40);
          }
        }
      }
    }

    if (hazard.type === "electricFloor" ||
        hazard.type === "ventBlast" ||
        hazard.type === "laser" ||
        hazard.type === "flamePillar" ||
        hazard.type === "stoneSpear" ||
        hazard.type === "crystalSpike" ||
        hazard.type === "fireHands" ||
        hazard.type === "strike" ||
        hazard.type === "templeBeam") {
      if (hazard.warning <= 0) {
        for (const player of [p1, p2]) {
          if (rectHit(player, hazard)) {
            damageHazardPlayer(
              player,
              hazard,
              player.x < hazard.x + hazard.w / 2 ? -1 : 1
            );
          }
        }
      }
    }

    if (hazard.type === "volcano") {
      if (hazard.warning === 0 && hazard.life % 24 === 0) {
        const lavaTarget = randomPlayer();

        addHazard("fallingObject", {
          x: targetPosition(lavaTarget, 20),
          y: hazard.y - 40,
          w: 20,
          h: 20,
          warning: 0,
          life: 100,
          target: lavaTarget,
          color: "#ff7d2e",
          damage: 9,
          power: 6.5,
          extra: "lava"
        });
      }
    }

    if (hazard.type === "thunderClap") {
      if (hazard.warning <= 0) {
        for (const player of [p1, p2]) {
          const dx = player.x + player.w / 2 - (hazard.x + hazard.w / 2);
          const dy = player.y + player.h / 2 - (hazard.y + hazard.h / 2);
          const distance = Math.hypot(dx, dy);

          if (distance < 145) {
            player.vx += (dx / Math.max(distance, 1)) * 1.5;

            if (frame % 16 === 0) {
              damageHazardPlayer(player, hazard, dx < 0 ? -1 : 1);
            }
          }
        }
      }
    }

    if (hazard.type === "jellyfish") {
      if (hazard.warning <= 0) {
        hazard.x += hazard.vx;
        hazard.y += Math.sin(frame * 0.08) * 0.8;

        for (const player of [p1, p2]) {
          if (rectHit(player, hazard)) {
            damageHazardPlayer(player, hazard, hazard.vx > 0 ? 1 : -1);
          }
        }
      }
    }

    if (hazard.type === "warpRift") {
      for (const player of [p1, p2]) {
        if (rectHit(player, hazard)) {
          const safePlatform = currentStage.platforms[
            Math.floor(Math.random() * currentStage.platforms.length)
          ];

          player.x = safePlatform.x + safePlatform.w / 2 - player.w / 2;
          player.y = safePlatform.y - player.h - 5;
          player.vx = 0;
          player.vy = 0;
          player.invincible = 25;

          addParticles(
            player.x + player.w / 2,
            player.y + player.h / 2,
            "#ca8cff",
            20,
            5
          );

          hazard.life = 0;
        }
      }
    }

    if (hazard.type === "tornado") {
      if (hazard.warning <= 0) {
        hazard.x += hazard.vx;

        if (hazard.x < 0 || hazard.x + hazard.w > WIDTH) {
          hazard.vx *= -1;
        }

        for (const player of [p1, p2]) {
          const dx = hazard.x + hazard.w / 2 - (player.x + player.w / 2);

          if (rectHit(player, hazard)) {
            player.vx += Math.sign(dx) * 0.45;
            player.vy -= 0.35;

            if (frame % 18 === 0) {
              damageHazardPlayer(player, hazard, dx > 0 ? 1 : -1);
            }
          }
        }
      }
    }

    if (hazard.type === "miner") {
      if (hazard.warning <= 0) {
        hazard.x += hazard.vx;

        if (hazard.life % 45 === 0) {
          const gemTarget = randomPlayer();

          addHazard("fallingObject", {
            x: targetPosition(gemTarget, 18),
            y: hazard.y,
            w: 18,
            h: 22,
            warning: 0,
            life: 100,
            target: gemTarget,
            color: "#ff9dea",
            damage: 8,
            power: 5.5,
            extra: "gem"
          });
        }
      }
    }

    if (hazard.type === "ufo") {
      if (hazard.warning <= 0) {
        /* The UFO is a temporary platform */
        if (hazard.life % 20 < 8) {
          const laserTarget = randomPlayer();

          addHazard("strike", {
            x: targetPosition(laserTarget, 28),
            y: hazard.y + 45,
            w: 28,
            h: 350,
            warning: 12,
            life: 38,
            target: laserTarget,
            color: "#b9f6ff",
            damage: 9,
            power: 6.5,
            extra: "ufoLaser"
          });
        }
      }
    }

    if (hazard.type === "alien") {
      if (hazard.warning <= 0 && hazard.life % 40 === 0) {
        const alienTarget = randomPlayer();

        addHazard("laser", {
          x: hazard.x < WIDTH / 2 ? hazard.x : 0,
          y: alienTarget.y + 24,
          w: hazard.x < WIDTH / 2 ? WIDTH - hazard.x : hazard.x,
          h: 10,
          warning: 13,
          life: 35,
          color: "#a6ff9d",
          damage: 9,
          power: 6.5
        });
      }
    }

    if (hazard.type === "devil") {
      if (hazard.warning <= 0 && hazard.life % 42 === 0) {
        const devilTarget = randomPlayer();

        addHazard("fallingObject", {
          x: targetPosition(devilTarget, 28),
          y: -25,
          w: 28,
          h: 28,
          warning: 20,
          life: 130,
          target: devilTarget,
          color: "#ff6532",
          damage: 11,
          power: 7.5
        });
      }
    }

    if (hazard.type === "risingLava" || hazard.type === "risingWater") {
      if (hazard.warning <= 0) {
        hazard.y -= 0.32;
        hazard.h = HEIGHT - hazard.y;

        for (const player of [p1, p2]) {
          if (rectHit(player, hazard)) {
            damageHazardPlayer(
              player,
              hazard,
              player.x < WIDTH / 2 ? -1 : 1
            );

            player.vy = -9;
          }
        }
      }
    }

    /* Hit checks for moving/falling physical hazards */
    const movingHazards = [
      "fallingObject",
      "swoop",
      "lightningBall",
      "banana",
      "mineCart",
      "chainSweep",
      "shark",
      "rollingBoulder"
    ];

    if (hazard.warning <= 0 && movingHazards.includes(hazard.type)) {
      for (const player of [p1, p2]) {
        if (rectHit(player, hazard)) {
          damageHazardPlayer(
            player,
            hazard,
            hazard.vx >= 0 ? 1 : -1
          );
        }
      }
    }

    /* Remove hazards */
    if (
      hazard.life <= 0 ||
      hazard.x < -250 ||
      hazard.x > WIDTH + 250 ||
      hazard.y > HEIGHT + 160
    ) {
      activeHazards.splice(i, 1);
    }
  }
}

/* ---------------------------
   MATCH TIMER
---------------------------- */
function updateMatchTimer() {
  if (
    mode === "practice" ||
    !roundStarted ||
    suddenDeath ||
    suddenDeathStarting ||
    gameOver
  ) {
    return;
  }

  matchTime--;

  if (matchTime <= 0) {
    startSuddenDeath();
  }
}

function checkFinalStockSuddenDeath() {
  if (
    mode === "practice" ||
    suddenDeath ||
    suddenDeathStarting ||
    gameOver ||
    !p1 ||
    !p2
  ) {
    return;
  }

  if (p1.lives === 1 && p2.lives === 1) {
    startSuddenDeath();
  }
}

/* ---------------------------
   SUDDEN DEATH
---------------------------- */
function startSuddenDeath() {
  if (suddenDeath || suddenDeathStarting || mode === "practice") return;

  suddenDeathStarting = true;
  roundStarted = false;
  suddenTimer = 300; /* 5 seconds */

  activeHazards = [];
  projectiles = [];

  p1.lives = 1;
  p2.lives = 1;

  resetPlayer(p1);
  resetPlayer(p2);

  p1.x = 305;
  p2.x = 615;
  p1.y = 350;
  p2.y = 350;

  cameraZoom = 0.93;
  flashTimer = 10;
  screenShake = 7;

  addText(
    WIDTH / 2,
    HEIGHT / 2 - 65,
    "SUDDEN DEATH!",
    "#ffef67"
  );

  playSound("ultimate");
}

function updateSuddenDeath() {
  if (!suddenDeathStarting) return;

  suddenTimer--;

  if (suddenTimer === 0) {
    suddenDeathStarting = false;
    suddenDeath = true;
    roundStarted = true;
    cameraZoom = 1;

    addText(
      WIDTH / 2,
      HEIGHT / 2,
      "CLASH!",
      "#ffffff"
    );

    playSound("special");
  }
}

/* ---------------------------
   PARTICLES AND TEXT
---------------------------- */
function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const particle = particles[i];

    particle.x += particle.vx;
    particle.y += particle.vy;
    particle.vy += particle.gravity || 0.08;
    particle.life--;

    if (particle.life <= 0) {
      particles.splice(i, 1);
    }
  }

  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const text = floatingTexts[i];

    text.y += text.vy;
    text.life--;

    if (text.life <= 0) {
      floatingTexts.splice(i, 1);
    }
  }

  if (flashTimer > 0) flashTimer--;

  if (comboCinematic > 0) {
    comboCinematic--;
    cameraZoom = 1.08;

    if (comboCinematic <= 0) {
      cameraZoom = 1;
      cinematicAttacker = null;
      cinematicTarget = null;
    }
  }

  if (koTimer > 0) {
    koTimer--;
    cameraZoom = 1.1;

    if (koTimer <= 0) {
      cameraZoom = 1;
    }
  }
}

/* ---------------------------
   ROUND COUNTDOWN
---------------------------- */
function updateCountdown() {
  if (roundStarted || suddenDeathStarting) return;

  countdown--;

  if (countdown <= 0) {
    roundStarted = true;

    addText(
      WIDTH / 2,
      HEIGHT / 2,
      "CLASH!",
      "#fff36a"
    );

    playSound("special");
  }
}

/* ---------------------------
   DRAWING HELPERS
---------------------------- */
function glow(color, blur = 12) {
  ctx.shadowColor = color;
  ctx.shadowBlur = blur;
}

function noGlow() {
  ctx.shadowColor = "transparent";
  ctx.shadowBlur = 0;
}

function drawStars(amount, maxY = HEIGHT) {
  for (let i = 0; i < amount; i++) {
    const x = (i * 79 + 17) % WIDTH;
    const y = (i * 43 + 11) % maxY;
    const size = Math.sin(frame * 0.05 + i) > 0.55 ? 3 : 2;

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(x, y, size, size);
  }
}

function drawCloud(x, y, size, alpha = 0.7) {
  ctx.fillStyle = `rgba(255,255,255,${alpha})`;
  ctx.fillRect(x, y, size * 2, size * 0.55);
  ctx.fillRect(x + size * 0.28, y - size * 0.35, size, size * 0.82);
  ctx.fillRect(x + size, y - size * 0.2, size * 0.8, size * 0.7);
}

function drawMountain(x, y, w, h, color, snow = null) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x, y + h);
  ctx.lineTo(x + w / 2, y);
  ctx.lineTo(x + w, y + h);
  ctx.fill();

  if (snow) {
    ctx.fillStyle = snow;
    ctx.beginPath();
    ctx.moveTo(x + w / 2, y);
    ctx.lineTo(x + w * 0.38, y + h * 0.27);
    ctx.lineTo(x + w * 0.5, y + h * 0.18);
    ctx.lineTo(x + w * 0.62, y + h * 0.27);
    ctx.fill();
  }
}

  bg.addColorStop(1, "#07132c");
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, WIDTH, HEIGHT);

  drawStars(105);

  /* Galaxy / black hole */
  glow("#bd72ff", 28);
  ctx.strokeStyle = "#8d5aff";
  ctx.lineWidth = 18;
  ctx.beginPath();
  ctx.arc(785, 120, 98, 0, Math.PI * 2);
  ctx.stroke();

  ctx.fillStyle = "#01010a";
  ctx.beginPath();
  ctx.arc(785, 120, 70, 0, Math.PI * 2);
  ctx.fill();
  noGlow();

  /* Space monsters, visual only */
  ctx.fillStyle = "rgba(135,92,205,0.4)";
  ctx.fillRect(145, 125, 55, 30);
  ctx.fillRect(135, 135, 12, 12);
  ctx.fillRect(200, 135, 12, 12);

  ctx.fillStyle = "#ff8ae9";
  ctx.fillRect(160, 133, 6, 6);
  ctx.fillRect(182, 133, 6, 6);

  /* Space debris */
  ctx.fillStyle = "#62738f";
  ctx.fillRect(90, 270, 60, 12);
  ctx.fillRect(180, 355, 34, 18);
  ctx.fillRect(675, 330, 45, 12);
}

function drawHellBackground() {
  const bg = ctx.createLinearGradient(0, 0, 0, HEIGHT);
  bg.addColorStop(0, "#170812");
  bg.addColorStop(0.6, "#4d151b");
  bg.addColorStop(1, "#7e211d");
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, WIDTH, HEIGHT);

  /* Red moon */
  glow("#ff4a3d", 20);
  ctx.fillStyle = "#cf3837";
  ctx.beginPath();
  ctx.arc(790, 100, 60, 0, Math.PI * 2);
  ctx.fill();
  noGlow();

  /* Fortress */
  ctx.fillStyle = "#25111b";
  ctx.fillRect(50, 220, 150, 230);
  ctx.fillRect(760, 190, 155, 260);
  ctx.fillRect(385, 255, 190, 195);

  /* Demon statues */
  ctx.fillStyle = "#3e1a24";
  ctx.fillRect(105, 155, 58, 120);
  ctx.fillRect(800, 125, 58, 120);

  const flashEyes = suddenDeath && Math.floor(frame / 15) % 2 === 0;
  ctx.fillStyle = flashEyes ? "#ffef55" : "#ff3939";
  ctx.fillRect(118, 190, 9, 8);
  ctx.fillRect(141, 190, 9, 8);
  ctx.fillRect(813, 160, 9, 8);
  ctx.fillRect(836, 160, 9, 8);

  /* Chains */
  ctx.strokeStyle = "#7b5450";
  ctx.lineWidth = 8;
  ctx.beginPath();
  ctx.moveTo(0, 60);
  ctx.lineTo(250, 210);
  ctx.lineTo(440, 80);
  ctx.stroke();

  /* Fire and reaching hands */
  glow("#ff622d", 15);
  ctx.fillStyle = "#ff5a29";
  ctx.fillRect(0, 485, WIDTH, 55);

  for (let x = 35; x < WIDTH; x += 100) {
    const handY = 455 + Math.sin(frame * 0.08 + x) * 7;
    ctx.fillStyle = "#852322";
    ctx.fillRect(x, handY, 13, 40);
    ctx.fillRect(x - 12, handY + 5, 12, 9);
    ctx.fillRect(x + 13, handY + 5, 12, 9);
  }
  noGlow();
}

function drawBackground() {
  if (currentStage.theme === "practice") drawPracticeBackground();
  if (currentStage.theme === "sky") drawSkyBackground();
  if (currentStage.theme === "neon") drawNeonBackground();
  if (currentStage.theme === "ice") drawIceBackground();
  if (currentStage.theme === "magma") drawMagmaBackground();
  if (currentStage.theme === "storm") drawStormBackground();
  if (currentStage.theme === "jungle") drawJungleBackground();
  if (currentStage.theme === "crystal") drawCrystalBackground();
  if (currentStage.theme === "moon") drawMoonBackground();
  if (currentStage.theme === "water") drawWaterBackground();
  if (currentStage.theme === "rock") drawRockBackground();
  if (currentStage.theme === "blackhole") drawBlackHoleBackground();
  if (currentStage.theme === "hell") drawHellBackground();
}

/* ---------------------------
   PLATFORM DRAWING
---------------------------- */
function drawPlatform(platform) {
  let top = "#d4ecff";
  let middle = "#6573a5";
  let bottom = "#28355c";

  const theme = currentStage.theme;

  if (theme === "practice") {
    top = "#aeb6be";
    middle = "#707982";
    bottom = "#3e464d";
  }
  if (theme === "sky") {
    top = "#f9ffff";
    middle = "#a6dce9";
    bottom = "#5d97aa";
  }
  if (theme === "neon") {
    top = "#55efff";
    middle = "#304486";
    bottom = "#161745";
    glow("#4eeaff", 8);
  }
  if (theme === "ice") {
    top = "#f2ffff";
    middle = "#6bc9e7";
    bottom = "#2e77a9";
  }
  if (theme === "magma") {
    top = "#ff9142";
    middle = "#713a39";
    bottom = "#2e1826";
    glow("#ff6e2e", 7);
  }
  if (theme === "storm") {
    top = "#9fc7f1";
    middle = "#4f638b";
    bottom = "#222e50";
  }
  if (theme === "jungle") {
    top = "#a7d36b";
    middle = "#65864c";
    bottom = "#324c31";
  }
  if (theme === "crystal") {
    top = "#8ff7ff";
    middle = "#6b4da0";
    bottom = "#2e2457";
    glow("#8cf5ff", 7);
  }
  if (theme === "moon") {
    top = "#d7e1f1";
    middle = "#71809f";
    bottom = "#35435e";
  }
  if (theme === "water") {
    top = "#a7ffff";
    middle = "#268ba8";
    bottom = "#09516f";
    glow("#7dffff", 6);
  }
  if (theme === "rock") {
    top = "#ccb07b";
    middle = "#75624c";
    bottom = "#3d342c";
  }
  if (theme === "blackhole") {
    top = "#c88dff";
    middle = "#554477";
    bottom = "#211b3d";
    glow("#c98cff", 7);
  }
  if (theme === "hell") {
    top = "#ff803b";
    middle = "#682d32";
    bottom = "#2c111b";
    glow("#ff592f", 7);
  }

  ctx.fillStyle = "rgba(0,0,0,0.3)";
  ctx.fillRect(platform.x + 5, platform.y + platform.h, platform.w, 8);

  ctx.fillStyle = middle;
  ctx.fillRect(platform.x, platform.y, platform.w, platform.h);

  ctx.fillStyle = top;
  ctx.fillRect(platform.x, platform.y, platform.w, 6);

  ctx.fillStyle = bottom;
  ctx.fillRect(platform.x, platform.y + platform.h - 5, platform.w, 5);

  ctx.fillStyle = "rgba(255,255,255,0.18)";
  for (let x = platform.x + 14; x < platform.x + platform.w - 8; x += 35) {
    ctx.fillRect(x, platform.y + 10, 11, 3);
  }

  if (platform.moving) {
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(platform.x + platform.w / 2 - 4, platform.y + 7, 8, 4);
  }

  noGlow();
}

/* ---------------------------
   HAZARD DRAWING
---------------------------- */
function drawHazards() {
  for (const h of activeHazards) {
    const warningAlpha = h.warning > 0
      ? 0.25 + Math.sin(frame * 0.3) * 0.14
      : 1;

    if (h.warning > 0) {
      ctx.fillStyle = `rgba(255,235,90,${warningAlpha})`;

      if (h.type === "fallingObject") {
        ctx.beginPath();
        ctx.ellipse(h.x + h.w / 2, 445, h.w * 0.9, 8, 0, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillRect(h.x, h.y, h.w, h.h);
      }

      ctx.strokeStyle = "#fff16b";
      ctx.lineWidth = 2;
      ctx.strokeRect(h.x, h.y, h.w, h.h);
      continue;
    }

    glow(h.color, 10);

    if (h.type === "fallingObject") {
      ctx.fillStyle = h.color;

      if (h.extra === "icicle") {
        ctx.beginPath();
        ctx.moveTo(h.x, h.y);
        ctx.lineTo(h.x + h.w, h.y);
        ctx.lineTo(h.x + h.w / 2, h.y + h.h);
        ctx.fill();
      } else if (h.extra === "anchor") {
        ctx.fillRect(h.x + h.w / 2 - 4, h.y, 8, h.h - 16);
        ctx.fillRect(h.x, h.y + h.h - 18, h.w, 12);
      } else {
        ctx.fillRect(h.x, h.y, h.w, h.h);
      }
    }

    if (h.type === "windZone") {
      ctx.strokeStyle = h.color;
      ctx.lineWidth = 3;

      for (let i = 0; i < 6; i++) {
        const y = h.y + 10 + i * 9;
        const x = h.direction === 1
          ? h.x + ((frame * 5 + i * 35) % h.w)
          : h.x + h.w - ((frame * 5 + i * 35) % h.w);

        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + h.direction * 45, y - 5);
        ctx.stroke();
      }
    }

    if (h.type === "strike") {
      ctx.fillStyle = h.color;
      ctx.fillRect(h.x, h.y, h.w, h.h);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(h.x + h.w / 2 - 5, h.y, 10, h.h);
    }

    if (h.type === "electricFloor" || h.type === "laser" || h.type === "templeBeam") {
      ctx.fillStyle = h.color;
      ctx.fillRect(h.x, h.y, h.w, h.h);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(h.x, h.y + h.h / 2 - 2, h.w, 4);
    }

    if (h.type === "ventBlast" || h.type === "flamePillar") {
      ctx.fillStyle = h.color;
      ctx.fillRect(h.x, h.y, h.w, h.h);
      ctx.fillStyle = "#fff1a4";
      ctx.fillRect(h.x + 9, h.y + 10, h.w - 18, h.h - 15);
    }

    if (h.type === "snowstorm" || h.type === "mist") {
      ctx.fillStyle = h.type === "snowstorm"
        ? "rgba(230,255,255,0.28)"
        : "rgba(220,250,255,0.35)";
      ctx.fillRect(h.x, h.y, h.w, h.h);

      for (let i = 0; i < 35; i++) {
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(
          h.x + (i * 47 + frame * 2) % h.w,
          h.y + (i * 23 + frame) % h.h,
          3,
          3
        );
      }
    }

    if (h.type === "whirlpool" || h.type === "gravityZone") {
      ctx.strokeStyle = h.color;
      ctx.lineWidth = 5;

      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.arc(
          h.x + h.w / 2,
          h.y + h.h / 2,
          h.w / 2 - i * 12,
          frame * 0.08 + i,
          frame * 0.08 + i + 4.8
        );
        ctx.stroke();
      }
    }

    if (h.type === "tornado") {
      ctx.fillStyle = h.color + "88";
      ctx.fillRect(h.x + 12, h.y, h.w - 24, h.h);
      ctx.fillRect(h.x + 5, h.y + 20, h.w - 10, 10);
      ctx.fillRect(h.x, h.y + 45, h.w, 12);
    }

    if (h.type === "swoop" || h.type === "banana" ||
        h.type === "mineCart" || h.type === "chainSweep" ||
        h.type === "shark") {
      ctx.fillStyle = h.color;
      ctx.fillRect(h.x, h.y, h.w, h.h);

      if (h.type === "shark") {
        ctx.fillStyle = "#ffffff";
        for (let x = h.x + 50; x < h.x + h.w - 20; x += 13) {
          ctx.fillRect(x, h.y + h.h - 10, 6, 7);
        }
      }
    }

    if (h.type === "volcano") {
      ctx.fillStyle = "#55312c";
      ctx.fillRect(h.x, h.y + 15, h.w, h.h - 15);
      ctx.fillStyle = "#ff7d2e";
      ctx.fillRect(h.x + 9, h.y, h.w - 18, 22);
    }

    if (h.type === "thunderClap") {
      ctx.strokeStyle = h.color;
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.arc(h.x + h.w / 2, h.y + h.h / 2, 43, 0, Math.PI * 2);
      ctx.stroke();
    }

    if (h.type === "jellyfish") {
      ctx.fillStyle = h.color;
      ctx.fillRect(h.x + 5, h.y, h.w - 10, 22);
      ctx.fillRect(h.x, h.y + 10, h.w, 12);

      for (let x = h.x + 6; x < h.x + h.w - 3; x += 7) {
        ctx.fillRect(x, h.y + 22, 3, h.h - 22);
      }
    }

    if (h.type === "warpRift") {
      ctx.strokeStyle = h.color;
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.arc(h.x + h.w / 2, h.y + h.h / 2, h.w / 2, frame * 0.1, frame * 0.1 + 5);
      ctx.stroke();
    }

    if (h.type === "lightningBall") {
      ctx.fillStyle = h.color;
      ctx.beginPath();
      ctx.arc(h.x + h.w / 2, h.y + h.h / 2, h.w / 2, 0, Math.PI * 2);
      ctx.fill();
    }

    if (h.type === "thornPatch") {
      ctx.fillStyle = "#5a993f";
      for (let x = h.x; x < h.x + h.w; x += 12) {
        ctx.beginPath();
        ctx.moveTo(x, h.y + h.h);
        ctx.lineTo(x + 6, h.y);
        ctx.lineTo(x + 12, h.y + h.h);
        ctx.fill();
      }
    }

    if (h.type === "crystalSpike") {
      ctx.fillStyle = h.color;
      ctx.beginPath();
      ctx.moveTo(h.x, h.y + h.h);
      ctx.lineTo(h.x + h.w / 2, h.y);
      ctx.lineTo(h.x + h.w, h.y + h.h);
      ctx.fill();
    }

    if (h.type === "miner") {
      ctx.fillStyle = "#8b7767";
      ctx.fillRect(h.x, h.y + 8, h.w, h.h - 8);
      ctx.fillStyle = "#ffcf61";
      ctx.fillRect(h.x + 7, h.y, h.w - 14, 13);
      ctx.fillStyle = "#7cf8ff";
      ctx.fillRect(h.x - 9, h.y + 16, 8, 10);
      ctx.fillRect(h.x + h.w + 1, h.y + 16, 8, 10);
    }

    if (h.type === "ufo") {
      ctx.fillStyle = "#809cb8";
      ctx.fillRect(h.x, h.y + 20, h.w, 18);
      ctx.fillStyle = "#baf7ff";
      ctx.fillRect(h.x + 70, h.y, 80, 22);
      ctx.fillStyle = "#ff79dc";
      ctx.fillRect(h.x + 20, h.y + 38, h.w - 40, 5);
    }

    if (h.type === "alien") {
      ctx.fillStyle = "#82db73";
      ctx.fillRect(h.x + 7, h.y + 10, h.w - 14, h.h - 10);
      ctx.fillStyle = "#d6ffbd";
      ctx.fillRect(h.x + 4, h.y, h.w - 8, 18);
      ctx.fillStyle = "#161b34";
      ctx.fillRect(h.x + 12, h.y + 7, 5, 5);
      ctx.fillRect(h.x + 28, h.y + 7, 5, 5);
    }

    if (h.type === "risingLava") {
      ctx.fillStyle = "#ff572a";
      ctx.fillRect(h.x, h.y, h.w, h.h);
      ctx.fillStyle = "#ffc83d";
      for (let x = 0; x < WIDTH; x += 70) {
        ctx.fillRect(x, h.y + 8, 35, 8);
      }
    }

    if (h.type === "risingWater") {
      ctx.fillStyle = "rgba(63,205,235,0.65)";
      ctx.fillRect(h.x, h.y, h.w, h.h);
      ctx.strokeStyle = "#d5ffff";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, h.y + 8);
      for (let x = 0; x <= WIDTH; x += 40) {
        ctx.lineTo(x, h.y + 8 + Math.sin(frame * 0.1 + x) * 5);
      }
      ctx.stroke();
    }

    if (h.type === "fireHands") {
      ctx.fillStyle = h.color;
      ctx.fillRect(h.x + 20, h.y, 20, h.h);
      ctx.fillRect(h.x, h.y + 10, 18, 12);
      ctx.fillRect(h.x + 42, h.y + 10, 18, 12);
    }

    if (h.type === "devil") {
      ctx.fillStyle = "#4b1720";
      ctx.fillRect(h.x + 35, h.y + 30, h.w - 70, h.h - 15);
      ctx.fillStyle = "#ff4f3c";
      ctx.fillRect(h.x + 58, h.y + 50, 14, 10);
      ctx.fillRect(h.x + 108, h.y + 50, 14, 10);
      ctx.fillStyle = "#e9d2a0";
      ctx.fillRect(h.x + 20, h.y, 20, 35);
      ctx.fillRect(h.x + h.w - 40, h.y, 20, 35);
    }

    noGlow();
  }
}

/* ---------------------------
   PLAYER GRAPHICS
---------------------------- */
function drawPlayer(player) {
  if (player.invincible > 0 && Math.floor(player.invincible / 4) % 2 === 0) {
    return;
  }

  const f = player.fighter;
  const bob = Math.sin(frame * 0.12 + player.idleOffset) * 1.5;
  const x = Math.floor(player.x);
  const y = Math.floor(player.y + bob);

  if (player.trailTimer > 0) {
    ctx.fillStyle = f.element + "66";
    ctx.fillRect(x - player.vx * 1.8, y + 15, player.w, 20);
  }

  if (player.ultimateTimer > 0) {
    glow(f.element, 20);
    ctx.fillStyle = f.element + "55";
    ctx.fillRect(x - 20, y - 20, player.w + 40, player.h + 40);
    noGlow();
  }

  /* Zephyr scarf only appears while moving */
  if (f.style === "scarf" && Math.abs(player.vx) > 0.8) {
    ctx.fillStyle = "#e9ffff";
    const scarfX = player.facing === 1 ? x - 26 : x + player.w;
    ctx.fillRect(scarfX, y + 16, 28, 7);
    ctx.fillStyle = f.accent;
    ctx.fillRect(scarfX - player.facing * 8, y + 23, 32, 5);
  }

  if (f.style === "cape") {
    ctx.fillStyle = "#19366d";
    const capeX = player.facing === 1 ? x - 10 : x + player.w - 4;
    ctx.fillRect(capeX, y + 17, 15, 34);
    ctx.fillStyle = "#f4d75d";
    ctx.fillRect(capeX, y + 18, 4, 29);
  }

  if (f.style === "leaves") {
    ctx.fillStyle = "#7bd65d";
    ctx.fillRect(x - 7, y + 19, 8, 13);
    ctx.fillRect(x + player.w - 1, y + 27, 9, 12);
  }

  if (f.style === "water") {
    glow("#8effff", 8);
    ctx.fillStyle = "#8effff";
    ctx.fillRect(x - 8, y + 35, 6, 10);
    ctx.fillRect(x + player.w + 2, y + 32, 6, 10);
    noGlow();
  }

  if (f.style === "void") {
    ctx.fillStyle = "#32135b";
    ctx.fillRect(x - 8, y + 17, 10, 35);
  }

  if (f.style === "chains") {
    ctx.strokeStyle = "#ff8737";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x - 8, y + 25);
    ctx.lineTo(x + 2, y + 32);
    ctx.lineTo(x - 7, y + 39);
    ctx.stroke();
  }

  /* Legs */
  ctx.fillStyle = f.dark;
  ctx.fillRect(x + 7, y + player.h - 12, 9, 13);
  ctx.fillRect(x + player.w - 16, y + player.h - 12, 9, 13);

  /* Body */
  ctx.fillStyle = f.dark;
  ctx.fillRect(x + 3, y + 18, player.w - 6, player.h - 28);

  ctx.fillStyle = f.color;
  ctx.fillRect(x + 7, y + 20, player.w - 14, player.h - 31);

  /* Chest element symbol */
  ctx.fillStyle = f.element;
  ctx.fillRect(x + player.w / 2 - 4, y + 29, 8, 8);

  /* Head */
  ctx.fillStyle = "#ffd3b2";
  ctx.fillRect(x + 6, y + 3, player.w - 12, 20);

  /* Hair / helmet */
  ctx.fillStyle = f.hair;
  ctx.fillRect(x + 4, y - 1, player.w - 8, 9);

  if (f.style === "visor") {
    ctx.fillStyle = "#221758";
    ctx.fillRect(x + 5, y + 7, player.w - 10, 6);
    ctx.fillStyle = "#ff70e8";
    ctx.fillRect(x + 8, y + 8, player.w - 16, 2);
  }

  if (f.style === "armour") {
    ctx.fillStyle = "#dcffff";
    ctx.fillRect(x + 2, y - 3, player.w - 4, 10);
    ctx.fillRect(x, y + 20, 9, 14);
    ctx.fillRect(x + player.w - 9, y + 20, 9, 14);
  }

  if (f.style === "lava") {
    glow("#ff7634", 9);
    ctx.fillStyle = "#ff7634";
    ctx.fillRect(x + 8, y + 23, 4, 17);
    ctx.fillRect(x + 20, y + 35, 4, 13);
    ctx.fillRect(x + player.w - 12, y + 26, 3, 17);
    noGlow();
  }

  if (f.style === "crystal") {
    ctx.fillStyle = "#e9dcff";
    ctx.fillRect(x + 8, y - 9, 5, 10);
    ctx.fillRect(x + player.w / 2 - 2, y - 13, 5, 14);
    ctx.fillRect(x + player.w - 13, y - 9, 5, 10);
  }

  if (f.style === "space") {
    ctx.fillStyle = "#eaf3ff";
    ctx.fillRect(x + 3, y, player.w - 6, 22);
    ctx.fillStyle = "#45638c";
    ctx.fillRect(x + 7, y + 5, player.w - 14, 10);
  }

  if (f.style === "stone") {
    ctx.fillStyle = "#89a35e";
    ctx.fillRect(x + 2, y + 20, 7, 14);
    ctx.fillRect(x + player.w - 9, y + 28, 7, 13);
  }

  if (f.style === "water") {
    ctx.fillStyle = "#b9ffff";
    ctx.fillRect(x + 3, y, player.w - 6, 22);
    ctx.fillStyle = "#3090aa";
    ctx.fillRect(x + 7, y + 5, player.w - 14, 10);
  }

  if (f.style === "void") {
    ctx.fillStyle = "#180c2d";
    ctx.fillRect(x + 5, y + 4, player.w - 10, 13);
  }

  /* Eye */
  ctx.fillStyle = "#17213f";
  const eyeX = player.facing === 1 ? x + player.w - 13 : x + 9;
  ctx.fillRect(eyeX, y + 10, 4, 4);

  /* Attack arm */
  if (player.attackTimer > 0) {
    if (f.id === "briar") {
      ctx.fillStyle = "#72c85a";
      const vineX = player.facing === 1 ? x + player.w : x - 52;
      ctx.fillRect(vineX, y + 23, 52, 6);
    } else {
      ctx.fillStyle = "#ffd3b2";
      const armX = player.facing === 1 ? x + player.w : x - 16;
      ctx.fillRect(armX, y + 22, 17, 8);
    }
  }

  /* Air attack */
  if (player.airAttackTimer > 0) {
    ctx.fillStyle = "#ffd3b2";
    ctx.fillRect(x + 8, y + player.h - 8, player.w - 16, 18);
    ctx.fillStyle = f.dark;
    ctx.fillRect(x + 6, y + player.h + 6, player.w - 12, 7);
  }

  /* Special effects */
  if (player.specialTimer > 0) {
    glow(f.element, 12);
    ctx.strokeStyle = f.element;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(x + player.w / 2, y + player.h / 2, 28, frame * 0.2, frame * 0.2 + 4.8);
    ctx.stroke();
    noGlow();
  }

  /* Fighter-specific shields */
  if (player.shielding) {
    glow(player.parryTimer > 0 ? "#ffffff" : f.element, 14);

    if (f.style === "armour") {
      ctx.fillStyle = "rgba(220,255,255,0.45)";
      ctx.fillRect(x - 9, y - 7, player.w + 18, player.h + 14);
    } else if (f.style === "leaves") {
      ctx.strokeStyle = "#a8f06d";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(x + player.w / 2, y + player.h / 2, player.w / 1.2, 0, Math.PI * 2);
      ctx.stroke();
    } else if (f.style === "chains") {
      ctx.strokeStyle = "#ff8737";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(x + player.w / 2, y + player.h / 2, player.w / 1.2, frame * 0.1, frame * 0.1 + 5.5);
      ctx.stroke();
    } else {
      ctx.strokeStyle = player.parryTimer > 0 ? "#ffffff" : f.element;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(x + player.w / 2, y + player.h / 2, player.w / 1.2, 0, Math.PI * 2);
      ctx.stroke();
    }

    noGlow();
  }

  if (player.stunned > 0) {
    ctx.fillStyle = "#fff363";
    ctx.fillRect(x + 2, y - 13, 7, 7);
    ctx.fillRect(x + player.w - 8, y - 19, 7, 7);
  }
}

function drawProjectile(shot) {
  glow(shot.color, 11);

  if (shot.kind === "gravity" || shot.kind === "void") {
    ctx.strokeStyle = shot.color;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(shot.x + shot.w / 2, shot.y + shot.h / 2, shot.w / 2, 0, Math.PI * 2);
    ctx.stroke();
  } else {
    ctx.fillStyle = shot.color + "77";
    ctx.fillRect(shot.x - 4, shot.y - 4, shot.w + 8, shot.h + 8);

    ctx.fillStyle = shot.color;
    ctx.fillRect(shot.x, shot.y, shot.w, shot.h);

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(shot.x + 4, shot.y + 4, Math.max(4, shot.w / 3), Math.max(4, shot.h / 4));
  }

  noGlow();
}

function drawParticles() {
  for (const particle of particles) {
    ctx.globalAlpha = clamp(particle.life / particle.maxLife, 0, 1);
    ctx.fillStyle = particle.color;
    ctx.fillRect(particle.x, particle.y, particle.size, particle.size);
  }
  ctx.globalAlpha = 1;
}

function drawFloatingTexts() {
  ctx.textAlign = "center";
  ctx.font = "bold 16px Arial";

  for (const text of floatingTexts) {
    ctx.globalAlpha = clamp(text.life / 30, 0, 1);
    glow(text.color, 8);
    ctx.fillStyle = text.color;
    ctx.fillText(text.text, text.x, text.y);
    noGlow();
  }

  ctx.globalAlpha = 1;
  ctx.textAlign = "left";
}

/* ---------------------------
   HUD
---------------------------- */
function drawMeter(x, y, width, value, color, flip = false) {
  ctx.fillStyle = "#0a1026";
  ctx.fillRect(x, y, width, 12);

  const filled = width * clamp(value / 100, 0, 1);

  glow(color, 7);
  ctx.fillStyle = color;

  if (flip) {
    ctx.fillRect(x + width - filled, y, filled, 12);
  } else {
    ctx.fillRect(x, y, filled, 12);
  }

  noGlow();

  ctx.strokeStyle = "#eaf8ff";
  ctx.strokeRect(x, y, width, 12);
}

function formatTime(frames) {
  const totalSeconds = Math.max(0, Math.ceil(frames / 60));
  const minutes = Math.floor(totalSeconds / 60);
  const seconds = String(totalSeconds % 60).padStart(2, "0");
  return `${minutes}:${seconds}`;
}

function drawHUD() {
  ctx.fillStyle = "rgba(7,12,34,0.82)";
  ctx.fillRect(14, 12, 270, 72);
  ctx.fillRect(WIDTH - 284, 12, 270, 72);

  ctx.textAlign = "left";
  ctx.font = "bold 18px Arial";
  ctx.fillStyle = p1.fighter.element;
  ctx.fillText(p1.fighter.name, 25, 37);

  ctx.font = "12px Arial";
  ctx.fillStyle = "#ffffff";
  ctx.fillText(
    mode === "practice" ? "TRAINING" : `♥ ${p1.lives}    SHIELD`,
    25,
    58
  );
  drawMeter(106, 48, 155, p1.shield, "#78dfff");

  ctx.textAlign = "right";
  ctx.font = "bold 18px Arial";
  ctx.fillStyle = p2.fighter.element;
  ctx.fillText(p2.fighter.name, WIDTH - 25, 37);

  ctx.font = "12px Arial";
  ctx.fillStyle = "#ffffff";
  ctx.fillText(
    mode === "practice" ? "CPU TRAINING" : `SHIELD    ♥ ${p2.lives}`,
    WIDTH - 25,
    58
  );
  drawMeter(WIDTH - 261, 48, 155, p2.shield, "#78dfff", true);

  ctx.textAlign = "center";
  ctx.font = "bold 19px Arial";
  ctx.fillStyle = "#ffffff";
  ctx.fillText(currentStage.name, WIDTH / 2, 29);

  if (mode !== "practice") {
    ctx.font = "bold 23px Arial";
    ctx.fillStyle = suddenDeath ? "#ffec60" : "#ffffff";
    ctx.fillText(suddenDeath ? "SUDDEN DEATH" : formatTime(matchTime), WIDTH / 2, 56);
  }

  ctx.textAlign = "left";
  ctx.font = "bold 51px Arial";
  ctx.fillStyle = damageColor(p1.damage);
  ctx.fillText(`${Math.floor(p1.damage)}%`, 22, HEIGHT - 22);

  ctx.textAlign = "right";
  ctx.fillStyle = damageColor(p2.damage);
  ctx.fillText(`${Math.floor(p2.damage)}%`, WIDTH - 22, HEIGHT - 22);

  ctx.textAlign = "left";
  ctx.font = "bold 12px Arial";
  ctx.fillStyle = "#ffffff";
  ctx.fillText("ULT", 28, HEIGHT - 78);
  drawMeter(60, HEIGHT - 90, 190, p1.meter, p1.fighter.element);

  ctx.textAlign = "right";
  ctx.fillText("ULT", WIDTH - 28, HEIGHT - 78);
  drawMeter(WIDTH - 250, HEIGHT - 90, 190, p2.meter, p2.fighter.element, true);

  ctx.textAlign = "left";
}

function drawCountdown() {
  if (roundStarted && !suddenDeathStarting) return;

  let words = "";

  if (suddenDeathStarting) {
    const number = Math.ceil(suddenTimer / 60);
    words = number > 0 ? `SUDDEN DEATH!  ${number}` : "CLASH!";
  } else {
    const number = Math.ceil(countdown / 50);
    words = number > 0 ? String(number) : "CLASH!";
  }

  ctx.textAlign = "center";
  ctx.font = "bold 58px Arial";
  glow("#fff36a", 17);
  ctx.fillStyle = "#fff36a";
  ctx.fillText(words, WIDTH / 2, HEIGHT / 2);
  noGlow();
  ctx.textAlign = "left";
}

/* ---------------------------
   LOADING + TITLE SCREEN
---------------------------- */
function drawLoading() {
  const bg = ctx.createLinearGradient(0, 0, 0, HEIGHT);
  bg.addColorStop(0, "#172b68");
  bg.addColorStop(1, "#050817");
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, WIDTH, HEIGHT);

  drawStars(100);

  const progress = clamp(loadingTimer / 165, 0, 1);

  ctx.textAlign = "center";

  ctx.font = "bold 48px Arial";
  glow("#b7f7ff", 18);
  ctx.fillStyle = "#b7f7ff";
  ctx.fillText("ELEMENTS AWAKEN...", WIDTH / 2, 200);
  noGlow();

  ctx.fillStyle = "#111a3a";
  ctx.fillRect(235, 275, 490, 26);

  glow("#7cf7ff", 10);
  ctx.fillStyle = "#7cf7ff";
  ctx.fillRect(240, 280, 480 * progress, 16);
  noGlow();

  ctx.font = "bold 18px Arial";
  ctx.fillStyle = "#ffffff";
  ctx.fillText(`${Math.floor(progress * 100)}%`, WIDTH / 2, 340);

  const elements = [
    "#d5ffff", "#fff06a", "#eaffff", "#ff9b32",
    "#a8f06d", "#7ff6ff", "#8effff", "#d28aff"
  ];

  for (let i = 0; i < elements.length; i++) {
    const angle = frame * 0.03 + i * Math.PI / 4;
    const x = WIDTH / 2 + Math.cos(angle) * 210;
    const y = 405 + Math.sin(angle) * 50;

    glow(elements[i], 12);
    ctx.fillStyle = elements[i];
    ctx.fillRect(x, y, 14, 14);
    noGlow();
  }

  ctx.textAlign = "left";
}

function drawTitle() {
  const bg = ctx.createLinearGradient(0, 0, 0, HEIGHT);
  bg.addColorStop(0, "#1f3479");
  bg.addColorStop(0.5, "#172657");
  bg.addColorStop(1, "#080b20");
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, WIDTH, HEIGHT);

  drawStars(90, 420);

  ctx.fillStyle = "rgba(84,217,232,0.12)";
  ctx.fillRect(110 + Math.sin(frame * 0.02) * 30, 0, 120, HEIGHT);

  ctx.fillStyle = "rgba(255,110,226,0.1)";
  ctx.fillRect(710 + Math.sin(frame * 0.017) * 35, 0, 110, HEIGHT);

  ctx.textAlign = "center";

  glow("#b7f7ff", 18);
  ctx.font = "bold 60px Arial";
  ctx.fillStyle = "#b7f7ff";
  ctx.fillText("SKY CLASH", WIDTH / 2, 118);
  noGlow();

  glow("#fff36a", 10);
  ctx.font = "bold 25px Arial";
  ctx.fillStyle = "#fff36a";
  ctx.fillText("ELEMENTAL ARENA", WIDTH / 2, 157);
  noGlow();

  ctx.fillStyle = "rgba(5,9,32,0.8)";
  ctx.fillRect(210, 205, 540, 205);
  ctx.strokeStyle = "#77dfff";
  ctx.lineWidth = 2;
  ctx.strokeRect(210, 205, 540, 205);

  ctx.font = "bold 21px Arial";
  ctx.fillStyle = "#ffffff";
  ctx.fillText("PRESS 1 — PLAYER VS CPU", WIDTH / 2, 250);
  ctx.fillText("PRESS 2 — TWO PLAYERS", WIDTH / 2, 293);
  ctx.fillText("PRESS 3 — PRACTICE MODE", WIDTH / 2, 336);

  ctx.font = "13px Arial";
  ctx.fillStyle = "#b8dcff";
  ctx.fillText("Practice Mode: no lives, no arena hazards, training room.", WIDTH / 2, 374);
  ctx.fillText(`Press M for sound: ${soundOn ? "ON" : "OFF"}`, WIDTH / 2, 395);

  for (let i = 0; i < 6; i++) {
    const f = fighters[i * 2];
    const x = 55 + i * 160;
    const y = 445 + Math.sin(frame * 0.08 + i) * 5;

    ctx.fillStyle = f.dark;
    ctx.fillRect(x + 9, y + 20, 34, 58);
    ctx.fillStyle = f.color;
    ctx.fillRect(x + 13, y + 23, 26, 48);
    ctx.fillStyle = "#ffd3b2";
    ctx.fillRect(x + 12, y + 3, 28, 20);
    ctx.fillStyle = f.hair;
    ctx.fillRect(x + 9, y - 1, 34, 9);

    ctx.font = "bold 10px Arial";
    ctx.fillStyle = f.element;
    ctx.fillText(f.name, x + 26, y + 103);
  }

  ctx.textAlign = "left";
}

/* ---------------------------
   ARCADE CHARACTER SELECT
---------------------------- */
function drawGridFighter(x, y, fighter, p1Here, p2Here) {
  const selected = p1Here || p2Here;

  ctx.fillStyle = selected ? fighter.element : "#172344";
  ctx.fillRect(x, y, 135, 105);

  ctx.fillStyle = "#0b1230";
  ctx.fillRect(x + 4, y + 4, 127, 97);

  ctx.fillStyle = fighter.dark;
  ctx.fillRect(x + 49, y + 33, 37, 48);
  ctx.fillStyle = fighter.color;
  ctx.fillRect(x + 54, y + 37, 27, 39);
  ctx.fillStyle = "#ffd3b2";
  ctx.fillRect(x + 53, y + 18, 29, 20);
  ctx.fillStyle = fighter.hair;
  ctx.fillRect(x + 50, y + 14, 35, 8);

  ctx.textAlign = "center";
  ctx.font = "bold 12px Arial";
  ctx.fillStyle = fighter.element;
  ctx.fillText(fighter.name, x + 67, y + 94);

  if (p1Here) {
    ctx.strokeStyle = "#63e8ff";
    ctx.lineWidth = 4;
    ctx.strokeRect(x, y, 135, 105);
    ctx.fillStyle = "#63e8ff";
    ctx.fillText("P1", x + 18, y + 16);
  }

  if (p2Here) {
    ctx.strokeStyle = mode === "vs" ? "#ff78d9" : "#b98cff";
    ctx.lineWidth = 3;
    ctx.strokeRect(x + 5, y + 5, 125, 95);
    ctx.fillStyle = mode === "vs" ? "#ff78d9" : "#b98cff";
    ctx.fillText(mode === "vs" ? "P2" : "CPU", x + 109, y + 16);
  }

  ctx.textAlign = "left";
}

function drawSelect() {
  ctx.fillStyle = "#0c1537";
  ctx.fillRect(0, 0, WIDTH, HEIGHT);

  ctx.textAlign = "center";
  ctx.font = "bold 29px Arial";
  ctx.fillStyle = "#b7f5ff";

  if (selectStep === 0) {
    ctx.fillText("CHOOSE YOUR FIGHTERS", WIDTH / 2, 39);

    const startX = 195;
    const startY = 62;

    for (let i = 0; i < fighters.length; i++) {
      const col = i % 4;
      const row = Math.floor(i / 4);

      drawGridFighter(
        startX + col * 142,
        startY + row * 112,
        fighters[i],
        i === p1Cursor,
        i === p2Cursor
      );
    }

    const f1 = fighters[p1Choice];
    const f2 = fighters[p2Choice];

    ctx.fillStyle = "rgba(5,10,30,0.82)";
    ctx.fillRect(90, 405, 780, 112);

    ctx.font = "bold 18px Arial";
    ctx.fillStyle = f1.element;
    ctx.fillText(`P1: ${f1.name}`, 245, 435);

    ctx.fillStyle = f2.element;
    ctx.fillText(`${mode === "vs" ? "P2" : "CPU"}: ${f2.name}`, 700, 435);

    ctx.font = "12px Arial";
    ctx.fillStyle = "#ffffff";
    ctx.fillText(f1.specialName, 245, 458);
    ctx.fillText(f2.specialName, 700, 458);

    ctx.font = "11px Arial";
    ctx.fillStyle = "#ffe96b";
    ctx.fillText(`Home: ${f1.homeStage}`, 245, 480);
    ctx.fillText(`Home: ${f2.homeStage}`, 700, 480);

    ctx.font = "13px Arial";
    ctx.fillStyle = "#dceaff";

    if (mode === "cpu" || mode === "practice") {
      ctx.fillText(
        `Difficulty: ${difficulty.toUpperCase()}  (1 Easy, 2 Medium, 3 Hard)`,
        WIDTH / 2,
        501
      );

      ctx.fillStyle = "#fff36a";
      ctx.fillText("P1 uses A/W/S/D • Arrow keys choose CPU • F or ENTER continues", WIDTH / 2, 522);
    } else {
      ctx.fillStyle = "#fff36a";
      ctx.fillText("P1 uses A/W/S/D • P2 uses Arrow keys • Both press F and K", WIDTH / 2, 510);
    }
  } else {
    const stage = mode === "practice" ? practiceStage : stages[stageChoice];

    ctx.fillText(mode === "practice" ? "PRACTICE MODE" : "CHOOSE A STAGE", WIDTH / 2, 48);

    ctx.fillStyle = "#06102b";
    ctx.fillRect(135, 78, 690, 325);

    const oldStage = currentStage;
    currentStage = stage;

    ctx.save();
    ctx.beginPath();
    ctx.rect(140, 83, 680, 315);
    ctx.clip();

    drawBackground();

    for (const platform of stage.platforms) {
      drawPlatform(platform);
    }

    ctx.restore();
    currentStage = oldStage;

    ctx.strokeStyle = "#b7f5ff";
    ctx.lineWidth = 3;
    ctx.strokeRect(135, 78, 690, 325);

    ctx.fillStyle = "rgba(5,10,30,0.85)";
    ctx.fillRect(180, 420, 600, 76);

    ctx.font = "bold 25px Arial";
    ctx.fillStyle = "#ffffff";
    ctx.fillText(stage.name, WIDTH / 2, 450);

    ctx.font = "14px Arial";
    ctx.fillStyle = "#dceaff";

    if (mode === "practice") {
      ctx.fillText("No hazards • no lives • CPU training opponent", WIDTH / 2, 474);
      ctx.fillStyle = "#fff36a";
      ctx.fillText("Press F or ENTER to begin • ESC goes back", WIDTH / 2, 514);
    } else {
      ctx.fillText("A / D or ← / → to choose • F or ENTER to begin", WIDTH / 2, 475);
      ctx.fillStyle = "#fff36a";
      ctx.fillText("Press ESC to return to fighter select", WIDTH / 2, 514);
    }
  }

  ctx.textAlign = "left";
}

/* ---------------------------
   GAME OVER
---------------------------- */
function drawGameOver() {
  ctx.fillStyle = "rgba(3,7,24,0.78)";
  ctx.fillRect(0, 0, WIDTH, HEIGHT);

  const winner = winnerText.startsWith(p1.fighter.name) ? p1 : p2;

  ctx.textAlign = "center";

  glow(winner.fighter.element, 18);
  ctx.font = "bold 54px Arial";
  ctx.fillStyle = winner.fighter.element;
  ctx.fillText(winnerText, WIDTH / 2, HEIGHT / 2 - 30);
  noGlow();

  /* Winner pose */
  ctx.fillStyle = winner.fighter.dark;
  ctx.fillRect(WIDTH / 2 - 22, HEIGHT / 2 + 10, 44, 72);

  ctx.fillStyle = winner.fighter.color;
  ctx.fillRect(WIDTH / 2 - 16, HEIGHT / 2 + 14, 32, 56);

  ctx.fillStyle = "#ffd3b2";
  ctx.fillRect(WIDTH / 2 - 15, HEIGHT / 2 - 10, 30, 25);

  ctx.fillStyle = winner.fighter.hair;
  ctx.fillRect(WIDTH / 2 - 19, HEIGHT / 2 - 14, 38, 9);

  ctx.font = "21px Arial";
  ctx.fillStyle = "#dbeeff";
  ctx.fillText("Press R or ENTER for character select", WIDTH / 2, HEIGHT / 2 + 132);

  ctx.font = "14px Arial";
  ctx.fillStyle = "#a9d7ff";
  ctx.fillText("Press ESC to return to the title screen", WIDTH / 2, HEIGHT / 2 + 158);

  ctx.textAlign = "left";
}

/* ---------------------------
   MAIN GAME DRAW
---------------------------- */
function drawGame() {
  ctx.save();

  if (cameraZoom !== 1) {
    ctx.translate(WIDTH / 2, HEIGHT / 2);
    ctx.scale(cameraZoom, cameraZoom);
    ctx.translate(-WIDTH / 2, -HEIGHT / 2);
  }

  if (screenShake > 0) {
    ctx.translate(
      (Math.random() - 0.5) * screenShake,
      (Math.random() - 0.5) * screenShake
    );

    screenShake *= 0.82;

    if (screenShake < 0.4) screenShake = 0;
  }

  drawBackground();

  for (const platform of currentStage.platforms) {
    drawPlatform(platform);
  }

  drawHazards();

  for (const shot of projectiles) {
    drawProjectile(shot);
  }

  drawParticles();

  drawPlayer(p1);
  drawPlayer(p2);

  drawHUD();
  drawFloatingTexts();
  drawCountdown();

  if (flashTimer > 0) {
    ctx.fillStyle = "rgba(255,255,255,0.16)";
    ctx.fillRect(0, 0, WIDTH, HEIGHT);
  }

  ctx.restore();

  if (screen === "over") drawGameOver();
}

/* ---------------------------
   MAIN LOOP
---------------------------- */
function gameLoop() {
  if (screen === "play" && !gameOver) {
    updateSuddenDeath();

    if (!suddenDeathStarting) {
      updateCountdown();
    }

    updatePlatforms();

    updatePlayer(p1, p2);
    updatePlayer(p2, p1);

    if (!gameOver) {
      updateProjectiles();
      updateHazards();
      updateMatchTimer();
      checkFinalStockSuddenDeath();
      updateParticles();

      frame++;
    }
  } else {
    updateMenu();
    frame++;
  }

  if (screen === "loading") drawLoading();
  if (screen === "title") drawTitle();
  if (screen === "select") drawSelect();
  if (screen === "play" || screen === "over") drawGame();

  for (const key in justPressed) {
    delete justPressed[key];
  }

  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
